name: Claude Code Review

# `pull_request_target` so PRs from forks are reviewed too: under `pull_request`
# they get no secrets or OIDC token. It runs this workflow as it is on the base
# branch, with the base repository's secrets, so never check out the PR head.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Review PRs from anyone, not just users with write access. Requires the
          # short-lived workflow token, scoped to the permissions above.
          allowed_non_write_users: "*"
          github_token: ${{ secrets.GITHUB_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a code review with the following focus areas:

            1. Correctness — bugs, edge cases, error handling
            2. Security — injection, unsafe input handling, secrets
            3. Performance — obvious inefficiencies or bottlenecks
            4. Test coverage — missing or inadequate tests

            Leave inline comments on specific issues and a top-level summary comment.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
